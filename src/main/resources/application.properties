# Initial data
storage.initial-data-file=initial-data/initial-data.json

# Server
server.port=8080

# Database config (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/gymcrm?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Logging
logging.level.org.springframework.security=TRACE
# Include [transactionId] in the logs using %X{key}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [%X{transactionId}] - %msg%n