# Server and Shared Logic
server.port=8080
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Logging
logging.level.org.springframework.security=TRACE
# Include [transactionId] in the logs using %X{key}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [%X{transactionId}] - %msg%n

# Expose endpoints
management.endpoints.web.exposure.include=health,info,prometheus,metrics

# Show detailed health info (useful for custom indicators)
management.endpoint.health.show-details=always