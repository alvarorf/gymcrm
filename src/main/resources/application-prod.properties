# Production Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/gymcrm_prod?useSSL=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234

# Safety: Validate schema instead of updating/creating
spring.jpa.hibernate.ddl-auto=validate

# Production Seeding Data (Reference for initialization)
storage.initial-data-file=initial-data/initial-prod-data.json

# Security & Logging
logging.level.org.springframework.security=WARN
logging.level.com.gymcrm=INFO